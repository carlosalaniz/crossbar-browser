name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/browsers
          key: cft-${{ runner.os }}-${{ hashFiles('scripts/ensure-browser.mjs') }}
      - run: npm ci
      - run: npm run check
        env:
          CI: "true"
          # Ubuntu 24.04 blocks unprivileged user namespaces, which Chrome's sandbox needs. Tests only.
          CROSSBAR_TEST_NO_SANDBOX: "1"
