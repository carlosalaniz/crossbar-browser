<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IdP</title></head>
<body><h1>IdP: allow access?</h1>
<button id="allow" autofocus>Allow</button>
<script>
  document.getElementById('allow').addEventListener('click', () => { window.opener.postMessage('signed-in', '*'); window.close(); });
</script>
</body></html>
