<!doctype html>
<html><head><meta charset="utf-8"><title>Infinite feed</title>
<style>body{margin:0;font:16px sans-serif} article{height:120px;border-bottom:1px solid #ccc;padding:8px}</style></head>
<body><main id="feed"></main>
<script>
  const TOTAL = 45; let n = 0; let loading = false;
  function more() {
    if (loading || n >= TOTAL) return; loading = true;
    setTimeout(() => {
      for (let i = 0; i < 10 && n < TOTAL; i++) { n++; const a = document.createElement('article'); a.dataset.postId = 'p' + n; a.innerHTML = '<a href="/post/' + n + '">Post number ' + n + '</a><p>Body of post ' + n + '</p>'; document.getElementById('feed').append(a); }
      loading = false;
    }, 150);
  }
  more();
  addEventListener('scroll', () => { if (innerHeight + scrollY > document.body.scrollHeight - 400) more(); });
</script></body></html>
