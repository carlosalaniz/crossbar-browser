<!-- Registers the test service worker and asks it to POST (audit S21). Needs a secure context: open on localhost. -->
<html><head><meta charset="utf-8"><title>SW</title></head><body><p>service worker host</p>
<script>navigator.serviceWorker.register('/sw.js').then(() => navigator.serviceWorker.ready).then((r) => r.active.postMessage('go'));</script>
</body></html>
