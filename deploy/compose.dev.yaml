# `npm run dev`: the stack plus a local test site. No accounts anywhere.
services:
  testsite:
    build: { context: .., dockerfile: deploy/Dockerfile, target: deps }
    working_dir: /src
    command: ["node", "scripts/testsite.ts"]
    volumes:
      - ../browser:/src/browser:ro
      - ../adapters:/src/adapters:ro
      - ../detect:/src/detect:ro
      - ../scripts:/src/scripts:ro
    environment:
      PORT: "8090"
    networks:
      egress:
        aliases: [testsite.test]
  proxy:
    environment:
      # Development only: lets the browser reach the test site on the private Docker network.
      CROSSBAR_DEV_ALLOW_PRIVATE_HOSTS: testsite.test
  app:
    environment:
      CROSSBAR_PACE_MS: "1000"
