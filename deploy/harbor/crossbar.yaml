# SPDX-License-Identifier: AGPL-3.0-only
# DRAFT Harbor manifest. Harbor's manifest schema isn't in this repo; this lists what Harbor needs to
# provide (ADR 0008) so the real manifest can be written against it. Harbor gives domain, TLS and
# image pins; Crossbar keeps its own login.
app:
  id: crossbar
  name: Crossbar
  description: Your own browser, lent to your agents, with you in the loop.
  license: AGPL-3.0-only
  source: https://github.com/carlosalaniz/crossbar-browser
compose: ../compose.yaml          # three services: app (public), browser (internal), proxy (egress)
expose:
  service: app
  port: 8080                      # the one public port
  healthcheck: /healthz
env:
  CROSSBAR_ORIGIN: "https://{{ domain }}"          # Harbor's domain for the app (TLS terminated by Harbor)
  CROSSBAR_BROWSER_SECRET: "{{ secret 48 }}"       # random per install, shared by app and browser only
  CROSSBAR_BLOCK_IPS: "{{ wan_ip }}"               # the home's public IP, if Harbor knows it
volumes:
  - app-data                      # back this up: database, master key, activity log
  - profiles                      # browser profiles (logins); back up if you want to keep sessions
first_run: |
  The setup code is printed in the app container's logs. Open the app and enter it.
  Reset the owner later with: docker compose exec app node server/src/main.ts reset-owner
