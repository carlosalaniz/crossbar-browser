<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification required</title>
<style>body{font:16px system-ui,sans-serif;max-width:560px;margin:10vh auto;padding:16px}h1{font-size:28px}</style></head>
<body>
<h1>site-a.test</h1>
<h2 id="challenge-title">Verification required</h2>
<p id="challenge-body-text">Solve the puzzle to continue.</p>
<form method="POST" action="/__captcha/clear" data-captcha id="challenge-form">
<input type="hidden" name="provider" value="arkose">
<input type="hidden" name="return_to" value="/gated/article?mode=always&amp;style=interstitial&amp;provider=arkose">
<div id="arkose-enforcement" class="arkose-enforcement" data-arkose data-sitekey="testsite-fake" data-testsite-fake="arkose">
  <iframe src="http://captcha.test/client-api.arkoselabs.com/fc/assets/ec-game-core/game-core/fake/standard/index.html" title="Arkose Labs (FunCaptcha) (test-site fake)" width="304" height="78" style="border:1px solid #bbb;border-radius:4px" sandbox="allow-scripts allow-same-origin"></iframe>
  <input type="hidden" name="fc-token" value="">
</div>
<script>
addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "testsite-captcha" || d.provider !== "arkose") return;
  if (new URL("http://captcha.test/client-api.arkoselabs.com/fc/assets/ec-game-core/game-core/fake/standard/index.html").origin !== e.origin) return;
  const f = document.querySelector('input[name="fc-token"]');
  f.value = d.token;
  f.form.submit();
});
</script>
<noscript><button>Continue</button></noscript>
</form>

</body></html>
