<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>site-a.test</title>
<style>body{font:16px system-ui,sans-serif;max-width:560px;margin:10vh auto;padding:16px}h1{font-size:28px}</style></head>
<body>
<h1>site-a.test</h1>
<h2 id="challenge-title">site-a.test</h2>
<p id="challenge-body-text">Please enable JS and disable any ad blocker</p>
<form method="POST" action="/__captcha/clear" data-captcha id="challenge-form">
<input type="hidden" name="provider" value="datadome">
<input type="hidden" name="return_to" value="/gated/article?mode=always&amp;style=interstitial&amp;provider=datadome">
<div id="ddChallenge" class="datadome-captcha" data-sitekey="testsite-fake" data-testsite-fake="datadome">
  <iframe src="http://captcha.test/geo.captcha-delivery.com/captcha/?initialCid=fake&amp;hash=fake&amp;cid=fake&amp;t=fe&amp;referer=fake" title="DataDome (test-site fake)" width="304" height="78" style="border:1px solid #bbb;border-radius:4px" sandbox="allow-scripts allow-same-origin"></iframe>
  <input type="hidden" name="datadome-response" value="">
</div>
<script>
addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "testsite-captcha" || d.provider !== "datadome") return;
  if (new URL("http://captcha.test/geo.captcha-delivery.com/captcha/?initialCid=fake&hash=fake&cid=fake&t=fe&referer=fake").origin !== e.origin) return;
  const f = document.querySelector('input[name="datadome-response"]');
  f.value = d.token;
  f.form.submit();
});
</script>
<noscript><button>Continue</button></noscript>
</form>

</body></html>
