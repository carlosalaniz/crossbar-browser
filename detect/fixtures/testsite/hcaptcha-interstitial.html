<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security check</title>
<style>body{font:16px system-ui,sans-serif;max-width:560px;margin:10vh auto;padding:16px}h1{font-size:28px}</style></head>
<body>
<h1>site-a.test</h1>
<h2 id="challenge-title">Security check</h2>
<p id="challenge-body-text">Please complete the security check to access this page.</p>
<form method="POST" action="/__captcha/clear" data-captcha id="challenge-form">
<input type="hidden" name="provider" value="hcaptcha">
<input type="hidden" name="return_to" value="/gated/article?mode=always&amp;style=interstitial&amp;provider=hcaptcha">
<div class="h-captcha" data-sitekey="testsite-fake" data-testsite-fake="hcaptcha">
  <iframe src="http://captcha.test/newassets.hcaptcha.com/captcha/v1/fake/static/hcaptcha.html#frame=checkbox" title="hCaptcha (test-site fake)" width="304" height="78" style="border:1px solid #bbb;border-radius:4px" sandbox="allow-scripts allow-same-origin"></iframe>
  <input type="hidden" name="h-captcha-response" value="">
</div>
<script>
addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "testsite-captcha" || d.provider !== "hcaptcha") return;
  if (new URL("http://captcha.test/newassets.hcaptcha.com/captcha/v1/fake/static/hcaptcha.html#frame=checkbox").origin !== e.origin) return;
  const f = document.querySelector('input[name="h-captcha-response"]');
  f.value = d.token;
  f.form.submit();
});
</script>
<noscript><button>Continue</button></noscript>
</form>

</body></html>
