<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create an account</title><style>
:root{color-scheme:light dark;--fg:#1b1b1f;--bg:#fafafa;--muted:#666;--line:#ddd;--accent:#2457d6;--warn:#b25e00}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8ec;--bg:#151518;--muted:#9a9aa3;--line:#333;--accent:#7aa2ff;--warn:#ffb057}}
body{font:15px/1.5 system-ui,sans-serif;color:var(--fg);background:var(--bg);margin:0 auto;max-width:880px;padding:16px}
header{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:8px}
header .host{color:var(--muted);font-family:ui-monospace,monospace;font-size:13px}
a{color:var(--accent)} code{font-family:ui-monospace,monospace;font-size:13px}
table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;font-size:14px}
.outcome{font-family:ui-monospace,monospace;font-size:12px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.note{color:var(--muted);font-size:13px} .warn{color:var(--warn)}
form{margin:12px 0} label{display:block;margin:6px 0} input,button,textarea,select{font:inherit}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
.disabled{opacity:.5}
</style></head>
<body><header><strong>Create an account</strong><span class="host">site-a.test</span><span style="flex:1"></span><a href="/">index</a></header>

<form method="POST" action="/register" data-captcha>
<label>Username <input name="username" autocomplete="username" required></label>
<label>Email <input type="email" name="email" autocomplete="email" required></label>
<label>Password <input type="password" name="password" autocomplete="new-password" required></label>
<label>Confirm password <input type="password" name="confirm" autocomplete="new-password" required></label>
<div class="cf-turnstile" data-sitekey="testsite-fake" data-testsite-fake="turnstile">
  <iframe src="http://captcha.test/challenges.cloudflare.com/cdn-cgi/challenge-platform/h/g/turnstile/if/ov2/av0/rcv/fake/normal" title="Cloudflare Turnstile (test-site fake)" width="304" height="78" style="border:1px solid #bbb;border-radius:4px" sandbox="allow-scripts allow-same-origin"></iframe>
  <input type="hidden" name="cf-turnstile-response" value="">
</div>
<script>
addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "testsite-captcha" || d.provider !== "turnstile") return;
  if (new URL("http://captcha.test/challenges.cloudflare.com/cdn-cgi/challenge-platform/h/g/turnstile/if/ov2/av0/rcv/fake/normal").origin !== e.origin) return;
  const f = document.querySelector('input[name="cf-turnstile-response"]');
  f.value = d.token;
  
});
</script>
<label><input type="checkbox" name="terms" value="1" required> I agree to the fixture terms</label>
<button>Create account</button></form></body></html>
