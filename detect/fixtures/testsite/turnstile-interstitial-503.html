<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Just a moment...</title>
<style>body{font:16px system-ui,sans-serif;max-width:560px;margin:10vh auto;padding:16px}h1{font-size:28px}</style></head>
<body class="no-js">
<h1>site-a.test</h1>
<h2 id="challenge-title">Just a moment...</h2>
<p id="challenge-body-text">Verify you are human by completing the action below. site-a.test needs to review the security of your connection before proceeding.</p>
<form method="POST" action="/__captcha/clear" data-captcha id="challenge-form">
<input type="hidden" name="provider" value="turnstile">
<input type="hidden" name="return_to" value="/gated/article?mode=always&amp;style=interstitial&amp;provider=turnstile&amp;status=503">
<div class="cf-turnstile" data-sitekey="testsite-fake" data-testsite-fake="turnstile">
  <iframe src="http://captcha.test/challenges.cloudflare.com/cdn-cgi/challenge-platform/h/g/turnstile/if/ov2/av0/rcv/fake/normal" title="Cloudflare Turnstile (test-site fake)" width="304" height="78" style="border:1px solid #bbb;border-radius:4px" sandbox="allow-scripts allow-same-origin"></iframe>
  <input type="hidden" name="cf-turnstile-response" value="">
</div>
<script>
addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "testsite-captcha" || d.provider !== "turnstile") return;
  if (new URL("http://captcha.test/challenges.cloudflare.com/cdn-cgi/challenge-platform/h/g/turnstile/if/ov2/av0/rcv/fake/normal").origin !== e.origin) return;
  const f = document.querySelector('input[name="cf-turnstile-response"]');
  f.value = d.token;
  f.form.submit();
});
</script>
<noscript><button>Continue</button></noscript>
</form>
<div class="footer">Performance &amp; security by Cloudflare (test-site fake)</div>
</body></html>
